name: Notion Progress Sync

# PRのライフサイクルに応じて Notion「開発進捗」DB の Status を自動更新する。
#   PR open / reopen         -> In Review
#   PR closed (merged=true)  -> Done
#   PR closed (merged=false) -> 変更なし
# PR のタイトルまたは本文の「TASK-<n>」を Ticket ID として突合する（例: Closes TASK-2）。

on:
  pull_request:
    types: [opened, reopened, closed]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync Notion status from PR
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # PR の文字列は環境変数経由で渡す（run ブロックへの直接展開はスクリプトインジェクションの原因になるため避ける）
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # 遷移先ステータスを決定
          if [ "$ACTION" = "closed" ]; then
            if [ "$PR_MERGED" = "true" ]; then
              TARGET="Done"
            else
              echo "PR closed without merge; no status change."
              exit 0
            fi
          else
            TARGET="In Review"
          fi

          # タイトル+本文から TASK-<n> の数値部分を抽出
          TEXT=$(printf '%s\n%s' "$PR_TITLE" "$PR_BODY")
          TASK_NUM=$(printf '%s' "$TEXT" | grep -oiE 'TASK-[0-9]+' | head -n1 | grep -oE '[0-9]+' || true)
          if [ -z "${TASK_NUM:-}" ]; then
            echo "No TASK-<n> reference found in PR title/body; skipping."
            exit 0
          fi
          echo "Ticket TASK-${TASK_NUM} -> ${TARGET}"

          # Ticket ID (unique_id) で対象ページを検索
          QUERY=$(jq -n --argjson num "$TASK_NUM" '{filter:{property:"Ticket ID", unique_id:{equals:$num}}}')
          RESP=$(curl -sS -X POST "https://api.notion.com/v1/databases/${NOTION_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$QUERY")
          PAGE_ID=$(printf '%s' "$RESP" | jq -r '.results[0].id // empty')
          if [ -z "$PAGE_ID" ]; then
            echo "No Notion page found for TASK-${TASK_NUM}. Response:"
            printf '%s\n' "$RESP"
            exit 1
          fi

          # Status を更新
          BODY=$(jq -n --arg s "$TARGET" '{properties:{Status:{select:{name:$s}}}}')
          curl -sS -X PATCH "https://api.notion.com/v1/pages/${PAGE_ID}" \
            -H "Authorization: Bearer ${NOTION_TOKEN}" \
            -H "Notion-Version: 2022-06-28" \
            -H "Content-Type: application/json" \
            -d "$BODY" | jq -e '.id' >/dev/null
          echo "Updated Notion page ${PAGE_ID} Status -> ${TARGET}"
