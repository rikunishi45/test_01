name: CI

# merge_group を入れておかないと、マージキュー内でチェックが走らず素通りする。
# 必須チェックとして意味を持たせるために pull_request と両方で発火させる。
on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ledger:
    name: 進捗台帳の契約検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/ledger.py validate

  definitions:
    name: エージェント定義と参照の検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_defs.py

  yaml-syntax:
    name: YAML構文
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 全YAMLをパースする
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in glob.glob(".github/**/*.y*ml", recursive=True):
              try:
                  yaml.safe_load(open(path, encoding="utf-8"))
              except yaml.YAMLError as e:
                  bad.append(f"{path}: {e}")
          if bad:
              print("YAML構文エラー:")
              for b in bad:
                  print(f"  - {b}")
              sys.exit(1)
          print("OK: すべてのYAMLがパースできる")
          PY

  secret-scan:
    name: 秘密情報スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks を実行する
        # gitleaks-action は実行ごとに GitHub API でアカウント種別を判定し、その
        # 通信が失敗するとライセンス必須へフォールバックして落ちる。必須チェックが
        # 外部通信の不調でランダムに失敗し、しかも「秘密情報を検出した」と区別
        # できない形で落ちる（実測: PR #11 で socket hang up → missing license）。
        # バイナリを直接実行してライセンス判定を経由しない。
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          # `git` は履歴全体をスキャンする（gitleaks-action と同等の範囲）。
          # `detect` は deprecated。--redact で検出値をログに出さない。
          /tmp/gitleaks git . --no-banner --redact
